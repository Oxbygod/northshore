<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Shore — Upcoming Nights</title>
<meta name="description" content="Upcoming nights at Vinyl, Highball, the Plaza and the Courtyard on Pittsburgh's North Shore. Tickets and guest list.">
<meta name="theme-color" content="#09090B">
<meta property="og:title" content="North Shore — Upcoming Nights">
<meta property="og:description" content="Tickets and guest list for Vinyl, Highball, the Plaza and the Courtyard.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090B;--panel:#111114;--line:#26262B;--ink:#F4F3EF;--mute:#9A978F;--dim:#6E6B64;--gold:#C6A87C;--gold-d:#8A6A3C;--ok:#7FB08A;--bad:#E07A6B;--r:3px;--pad:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 "Instrument Sans",system-ui,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 var(--pad)}
.eyebrow{font:600 11px/1 "Instrument Sans";letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.mono{font-family:"JetBrains Mono",monospace}
.serif{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500}
.display{font-family:Syne,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
header.top{position:sticky;top:0;z-index:5;background:rgba(9,9,11,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{font:700 14px/1 Syne;letter-spacing:.28em;text-decoration:none}
.brand small{display:block;font:500 9px/1 "Instrument Sans";letter-spacing:.24em;color:var(--mute);margin-top:6px}
.mypasses{font:600 11px/1 "Instrument Sans";letter-spacing:.18em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid var(--gold-d);padding:9px 12px;border-radius:var(--r)}
.hero{padding:44px 0 26px}
.hero h1{font-size:clamp(46px,13vw,92px)}
.hero p{font-size:clamp(20px,5vw,26px);color:var(--gold);margin-top:14px;max-width:30ch}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:none;padding:10px 14px;border-radius:var(--r);font:600 11px/1 "Instrument Sans";letter-spacing:.16em;text-transform:uppercase;color:var(--mute);cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--gold);color:var(--bg);background:var(--gold)}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:64px 1fr;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none;cursor:pointer}
.row:hover .rname{color:var(--gold)}
.date{border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:8px 0 9px;height:fit-content}
.date .m{font:600 10px/1 "Instrument Sans";letter-spacing:.2em;color:var(--gold)}
.date .d{font:700 28px/1.05 Syne;margin-top:4px}
.date .w{font:500 10px/1 "Instrument Sans";letter-spacing:.16em;color:var(--mute);margin-top:3px}
.rseries{font:600 10px/1 "Instrument Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:7px}
.rname{font:700 21px/1.1 Syne;text-transform:uppercase;transition:color .15s}
.rline{color:var(--mute);margin-top:6px;font-size:14px}
.rmeta{font:400 12px/1.4 "JetBrains Mono";color:var(--dim);margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font:600 10px/1 "Instrument Sans";letter-spacing:.16em;text-transform:uppercase;padding:6px 8px;border-radius:var(--r);border:1px solid var(--line);color:var(--mute)}
.tag.gl{border-color:var(--gold-d);color:var(--gold)}
.empty{padding:60px 0;color:var(--mute)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:var(--r);border:1px solid var(--gold);background:var(--gold);color:var(--bg);font:700 13px/1 "Instrument Sans";letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.btn.ghost{background:none;color:var(--gold)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{display:inline-flex;align-items:center;gap:8px;margin:22px 0 4px;font:600 11px/1 "Instrument Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-decoration:none;background:none;border:0;cursor:pointer}
.flyer{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);margin:18px 0 6px;background:var(--panel)}
.detail h1{font-size:clamp(38px,10vw,64px);margin-top:16px}
.lineup{list-style:none;margin:20px 0 4px}
.lineup li{font:500 22px/1.35 "Cormorant Garamond";font-style:italic;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);margin:22px 0;overflow:hidden}
.facts div{background:var(--bg);padding:14px 12px}
.facts span{display:block;font:600 10px/1 "Instrument Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.facts b{font:700 15px/1.2 "Instrument Sans"}
.blurb{color:var(--mute);margin:6px 0 22px;font-size:16px}
.actions{display:grid;gap:10px;margin:8px 0 10px}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:22px 0;background:var(--panel)}
.panel h2{font:700 18px/1.1 Syne;text-transform:uppercase;letter-spacing:.02em}
.panel .sub{color:var(--mute);font-size:14px;margin-top:6px}
.field{margin-top:16px}
.field label{display:block;font:600 10px/1 "Instrument Sans";letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.field input,.field select{width:100%;height:52px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--gold)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;color:var(--mute);font-size:13px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none;margin-top:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.note{font-size:12px;color:var(--dim);margin-top:14px}
.err{color:var(--bad);font-size:14px;margin-top:14px;min-height:1em}
.spots{font:400 12px/1 "JetBrains Mono";color:var(--gold);margin-top:10px}
.share{display:flex;gap:10px;margin-top:10px}
.share .btn{min-height:46px;font-size:11px}
.pass{text-align:center;padding:26px 0 10px}
.pass .who{font:700 30px/1 Syne;text-transform:uppercase;margin-top:12px}
.qrbox{background:#F4F3EF;border-radius:var(--r);padding:18px;width:min(78vw,320px);margin:22px auto 14px}
.qrbox svg{display:block;width:100%;height:auto}
.code{font:700 26px/1 "JetBrains Mono";letter-spacing:.3em;margin-top:6px}
.pass .facts{text-align:left}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r);font-weight:600;font-size:13px;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
footer{border-top:1px solid var(--line);margin-top:50px;padding:26px 0 40px;color:var(--dim);font-size:12px}
footer a{color:var(--mute)}
.skel{height:96px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.fade{animation:fd .35s ease both}
@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.skel{animation:none}}
@media (min-width:700px){.row{grid-template-columns:76px 1fr}.actions{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="./">NORTH SHORE<small>PITTSBURGH · NIGHTS</small></a>
  <a class="mypasses" href="./?mine=1" id="mineLink" hidden>My passes</a>
</div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<footer><div class="wrap">
  Presented by Grind &amp; Groove PGH / 2G Consulting with Legacy Hospitality.<br>
  Tickets are sold through Flite and are final sale. Guest list is subject to capacity, venue policy and a valid photo ID.
</div></footer>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  var API = 'https://script.google.com/macros/s/AKfycbwAdv5d9GWOWVRYB0Dw5JGKxgeKNtD7BJltcL0Kee8p79LBeScdctYYLCCe4ZWrxjZ9/exec';
  var qs = new URLSearchParams(location.search);
  var DEMO = qs.get('demo') === '1';
  var app = document.getElementById('app');
  var VENUES = { 'Shortys': "Shorty's", 'Plaza + Highball': 'Plaza + Highball', 'Legacy North Shore': 'North Shore campus' };
  var SERIES = ['Vinyl Thursdays', 'Vinyl Weekends', 'Mega-Event', 'Courtyard Sessions', 'Special'];
  var MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var DOW = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

  // ── storage (fails soft: private mode, sandboxed frames)
  function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function rememberPass(p) {
    var all = load('ns_passes', []).filter(function (x) { return x.code !== p.code; });
    all.unshift({ code: p.code, name: p.show.name, date: p.show.date });
    save('ns_passes', all.slice(0, 20));
  }

  // ── helpers
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function parts(ymd) { var d = new Date(ymd + 'T12:00:00'); return { m: MON[d.getMonth()], d: d.getDate(), w: DOW[d.getDay()], full: DOW[d.getDay()].charAt(0) + DOW[d.getDay()].slice(1).toLowerCase() + ', ' + MON[d.getMonth()].charAt(0) + MON[d.getMonth()].slice(1).toLowerCase() + ' ' + d.getDate() }; }
  function venue(v) { return VENUES[v] || v || 'North Shore'; }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('on'); }, 2200); }
  function go(params) { if (DEMO) params = (params ? params + '&' : '') + 'demo=1'; var u = './' + (params ? '?' + params : ''); history.pushState({}, '', u); route(); window.scrollTo(0, 0); }
  function linkFor(id) { return location.origin + location.pathname + '?show=' + id; }
  function track(name) { if (window.gtag) window.gtag('event', name); }

  function call(action, body) {
    if (DEMO) return demo(action, body || {});
    var payload = Object.assign({ action: action }, body || {});
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .catch(function () { return { ok: false, error: 'Connection problem. Check your signal and try again.' }; });
  }

  // ── views
  function skeleton() { app.innerHTML = '<div class="hero"><div class="skel" style="height:120px;border:0"></div></div><div class="list">' + '<div class="skel"></div>'.repeat(4) + '</div>'; }

  function listView(series) {
    skeleton();
    call('publicShows').then(function (res) {
      var shows = (res && res.shows) || [];
      var have = SERIES.filter(function (s) { return shows.some(function (x) { return x.series === s; }); });
      var shown = series ? shows.filter(function (s) { return s.series === series; }) : shows;
      var h = '<section class="hero fade"><div class="eyebrow">Vinyl · Highball · Plaza · Courtyard</div>' +
        '<h1 class="display" style="margin-top:14px">Upcoming<br>Nights</h1>' +
        '<p class="serif">House, techno and late nights on Pittsburgh’s North Shore.</p></section>';
      if (have.length > 1) {
        h += '<nav class="chips" aria-label="Filter by series"><button class="chip" data-s="" aria-pressed="' + (!series) + '">All</button>' +
          have.map(function (s) { return '<button class="chip" data-s="' + esc(s) + '" aria-pressed="' + (series === s) + '">' + esc(s) + '</button>'; }).join('') + '</nav>';
      }
      if (!res.ok) h += '<div class="empty">' + esc(res.error || 'Could not load shows.') + '</div>';
      else if (!shown.length) h += '<div class="empty">New nights are announced every week. Check back soon.</div>';
      else h += '<div class="list fade">' + shown.map(rowHtml).join('') + '</div>';
      app.innerHTML = h;
      app.querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { go(b.dataset.s ? 'series=' + encodeURIComponent(b.dataset.s) : ''); }; });
      app.querySelectorAll('.row').forEach(function (r) { r.onclick = function (e) { e.preventDefault(); go('show=' + r.dataset.id); }; });
    });
  }

  function rowHtml(s) {
    var p = parts(s.date);
    var tags = [];
    if (s.tickets) tags.push('<span class="tag">Tickets</span>');
    if (s.guestList.open) tags.push('<span class="tag gl">Guest list open</span>');
    if (s.age) tags.push('<span class="tag">' + esc(s.age) + '</span>');
    return '<a class="row" href="./?show=' + s.id + (DEMO ? '&demo=1' : '') + '" data-id="' + s.id + '">' +
      '<div class="date"><div class="m">' + p.m + '</div><div class="d">' + p.d + '</div><div class="w">' + p.w + '</div></div>' +
      '<div>' + (s.series ? '<div class="rseries">' + esc(s.series) + '</div>' : '') +
      '<div class="rname">' + esc(s.name) + '</div>' +
      (s.lineup.length ? '<div class="rline">' + esc(s.lineup.slice(0, 4).join(' · ')) + '</div>' : '') +
      '<div class="rmeta">' + esc(venue(s.venue)) + (s.doors ? ' · DOORS ' + esc(s.doors) : '') + '</div>' +
      '<div class="tags">' + tags.join('') + '</div></div></a>';
  }

  function showView(id) {
    skeleton();
    call('publicShow', { id: id }).then(function (res) {
      if (!res.ok) { app.innerHTML = '<button class="back" id="bk">← All nights</button><div class="empty">' + esc(res.error) + '</div>'; document.getElementById('bk').onclick = function () { go(''); }; return; }
      var s = res.show, p = parts(s.date), gl = s.guestList;
      document.title = s.name + ' — ' + p.full + ' · North Shore';
      var h = '<div class="detail fade"><button class="back" id="bk">← All nights</button>' +
        (s.flyer ? '<img class="flyer" src="' + esc(s.flyer) + '" alt="' + esc(s.name) + ' flyer" onerror="this.remove()">' : '') +
        '<div class="eyebrow" style="margin-top:18px">' + esc(s.series || venue(s.venue)) + '</div>' +
        '<h1 class="display">' + esc(s.name) + '</h1>' +
        (s.lineup.length ? '<ul class="lineup">' + s.lineup.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '') +
        '<div class="facts"><div><span>Date</span><b>' + p.full + '</b></div><div><span>Doors</span><b>' + esc(s.doors || 'TBA') + '</b></div><div><span>Age</span><b>' + esc(s.age || '21+') + '</b></div></div>' +
        (s.blurb ? '<p class="blurb">' + esc(s.blurb) + '</p>' : '') +
        '<div class="actions">' +
        (s.tickets ? '<a class="btn" id="tix" href="' + esc(s.tickets) + '" target="_blank" rel="noopener">Get tickets</a>' : '') +
        '<button class="btn ghost" id="cal">Add to calendar</button></div>' +
        '<div class="share"><button class="btn ghost" id="shr">Share this night</button></div>';
      if (gl.open) {
        if (gl.full) h += '<div class="panel"><h2>Guest list is full</h2><p class="sub">' + (s.tickets ? 'Tickets may still be available above.' : 'Follow us for the next one.') + '</p></div>';
        else h += '<form class="panel" id="rsvp" novalidate><h2>Join the guest list</h2>' +
          '<p class="sub">' + esc(gl.terms || 'Free entry on the list, subject to capacity.') + '</p>' +
          (gl.low ? '<div class="spots">ONLY ' + gl.spotsLeft + ' SPOTS LEFT</div>' : '') +
          '<div class="field"><label for="nm">Full name (as on your ID)</label><input id="nm" autocomplete="name" required maxlength="60"></div>' +
          '<div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" inputmode="email" required maxlength="120"></div>' +
          '<div class="field"><label for="ph">Mobile (optional)</label><input id="ph" type="tel" autocomplete="tel" inputmode="tel" maxlength="20"></div>' +
          (gl.maxPlus > 0 ? '<div class="field"><label for="pl">Bringing</label><select id="pl"><option value="0">Just me</option>' +
            Array.from({ length: gl.maxPlus }, function (_, i) { return '<option value="' + (i + 1) + '">Me +' + (i + 1) + '</option>'; }).join('') + '</select></div>' : '') +
          '<div class="hp" aria-hidden="true"><label>Leave blank<input id="hp" tabindex="-1" autocomplete="off"></label></div>' +
          '<label class="check"><input type="checkbox" id="op"> Send me first access to future North Shore nights. Unsubscribe anytime.</label>' +
          '<div class="err" id="er"></div>' +
          '<button class="btn" id="go" type="submit" style="margin-top:16px">Get my pass</button>' +
          '<p class="note">Everyone in your group needs a valid photo ID' + (s.age === '21+' ? ' showing 21+' : '') + '. Arrive together; plus-ones enter with you.</p></form>';
      }
      h += '</div>';
      app.innerHTML = h;
      document.getElementById('bk').onclick = function () { history.length > 1 ? history.back() : go(''); };
      document.getElementById('cal').onclick = function () { ics(s); };
      document.getElementById('shr').onclick = function () { share(s); };
      var tix = document.getElementById('tix'); if (tix) tix.onclick = function () { track('ticket_click'); };
      var f = document.getElementById('rsvp'); if (f) f.onsubmit = function (e) { e.preventDefault(); submit(s); };
    });
  }

  function submit(s) {
    var btn = document.getElementById('go'), er = document.getElementById('er');
    var body = { id: s.id, name: val('nm'), email: val('em'), phone: val('ph'), plus: Number(val('pl') || 0), optIn: document.getElementById('op').checked, hp: val('hp') };
    if (body.name.trim().split(/\s+/).length < 2) { er.textContent = 'Enter your first and last name as it appears on your ID.'; return; }
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(body.email.trim())) { er.textContent = 'Enter a valid email so we can send your pass.'; return; }
    er.textContent = ''; btn.disabled = true; btn.textContent = 'Adding you…';
    call('rsvp', body).then(function (res) {
      if (!res.ok || !res.pass) { er.textContent = (res && res.error) || 'Something went wrong. Try again.'; btn.disabled = false; btn.textContent = 'Get my pass'; return; }
      track('rsvp');
      rememberPass(res.pass);
      history.pushState({}, '', './?pass=' + res.pass.code + (DEMO ? '&demo=1' : ''));
      passView(res.pass, res.existing ? 'You were already on the list. Here’s your pass.' : (res.pass.emailed ? 'You’re in. We also emailed this pass to you.' : 'You’re in. Screenshot this pass or bookmark this page.'));
      window.scrollTo(0, 0);
    });
  }

  function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }

  function qrSvg(text) {
    var q = qrcode(0, 'M'); q.addData(text); q.make();
    return q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  }

  function passView(p, msg) {
    var d = parts(p.show.date);
    document.title = 'Your pass — ' + p.show.name;
    app.innerHTML = '<div class="pass fade"><div class="eyebrow">Guest list · ' + esc(venue(p.show.venue)) + '</div>' +
      '<div class="who">' + esc(p.firstName) + (p.plus ? ' +' + p.plus : '') + '</div>' +
      (msg ? '<p class="sub" style="color:var(--gold);margin-top:10px">' + esc(msg) + '</p>' : '') +
      '<div class="qrbox" aria-label="Door QR code">' + qrSvg(p.qr) + '</div>' +
      '<div class="code">' + esc(p.code) + '</div>' +
      (p.checkedIn ? '<p class="spots" style="margin-top:14px">CHECKED IN</p>' : '') +
      '<div class="facts"><div><span>Night</span><b>' + esc(p.show.name) + '</b></div><div><span>Date</span><b>' + d.full + '</b></div><div><span>Doors</span><b>' + esc(p.show.doors || 'TBA') + '</b></div></div>' +
      (p.show.terms ? '<p class="blurb" style="text-align:left">' + esc(p.show.terms) + '</p>' : '') +
      '<p class="note" style="text-align:left">Show this QR and a valid photo ID at the door. Turn your screen brightness up.</p>' +
      '<div class="actions" style="margin-top:18px"><button class="btn ghost" id="sv">Back to all nights</button></div></div>';
    document.getElementById('sv').onclick = function () { go(''); };
    document.getElementById('mineLink').hidden = false;
  }

  function passLookup(code) {
    skeleton();
    call('pass', { code: code }).then(function (res) {
      if (!res.ok) { app.innerHTML = '<div class="empty">' + esc(res.error) + '</div>'; return; }
      rememberPass(res.pass); passView(res.pass, '');
    });
  }

  function mineView() {
    var all = load('ns_passes', []);
    app.innerHTML = '<button class="back" id="bk">← All nights</button><h1 class="display" style="font-size:44px;margin:16px 0 18px">My passes</h1>' +
      (all.length ? '<div class="list">' + all.map(function (x) { var p = parts(x.date); return '<a class="row" href="./?pass=' + esc(x.code) + '"><div class="date"><div class="m">' + p.m + '</div><div class="d">' + p.d + '</div><div class="w">' + p.w + '</div></div><div><div class="rname">' + esc(x.name) + '</div><div class="rmeta">CODE ' + esc(x.code) + '</div></div></a>'; }).join('') + '</div>'
        : '<div class="empty">Passes you get on this phone show up here.</div>');
    document.getElementById('bk').onclick = function () { go(''); };
  }

  function share(s) {
    var url = linkFor(s.id), text = s.name + ' · ' + parts(s.date).full + ' · North Shore';
    if (navigator.share) { navigator.share({ title: s.name, text: text, url: url }).catch(function () {}); return; }
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { toast('Link copied'); }, function () { prompt('Copy this link', url); });
  }

  function ics(s) {
    var d = s.date.replace(/-/g, ''), next = new Date(s.date + 'T12:00:00'); next.setDate(next.getDate() + 1);
    var d2 = next.toISOString().slice(0, 10).replace(/-/g, '');
    var body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//North Shore//Nights//EN', 'BEGIN:VEVENT', 'UID:ns-' + s.id + '@northshore', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z',
      'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + d2, 'SUMMARY:' + s.name.replace(/[,;]/g, ' '), 'LOCATION:' + venue(s.venue) + ' - North Shore Pittsburgh',
      'DESCRIPTION:Doors ' + (s.doors || 'TBA') + '. ' + linkFor(s.id), 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([body], { type: 'text/calendar' })); a.download = 'north-shore-' + s.id + '.ics'; document.body.appendChild(a); a.click(); a.remove();
  }

  // ── router
  function route() {
    var q = new URLSearchParams(location.search);
    document.title = 'North Shore — Upcoming Nights';
    document.getElementById('mineLink').hidden = !load('ns_passes', []).length;
    if (q.get('pass')) return passLookup(q.get('pass'));
    if (q.get('show')) return showView(q.get('show'));
    if (q.get('mine')) return mineView();
    listView(q.get('series') || '');
  }
  window.addEventListener('popstate', route);
  route();

  // ── demo data (?demo=1): sample nights for previews and training; nothing is saved
  function demo(action, b) {
    var t = new Date(); function plus(n) { var d = new Date(t); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    var dow = t.getDay(), toThu = (4 - dow + 7) % 7 || 7;
    var shows = [
      { id: 101, name: 'Bass Bingo', date: plus(toThu), venue: 'Vinyl', series: 'Vinyl Thursdays', doors: '9:00 PM', age: '21+', lineup: ['Resident DJ', 'Bingo host'], blurb: 'Bass music, bingo cards and prizes every round.', flyer: '', tickets: '', guestList: { open: true, terms: 'Free before 11 PM with RSVP. 21+ with valid ID.', maxPlus: 1, spotsLeft: 12, low: true } },
      { id: 102, name: 'Vinyl Launch Weekend', date: plus(toThu + 1), venue: 'Vinyl', series: 'Vinyl Weekends', doors: '10:00 PM', age: '21+', lineup: ['Touring Headliner', 'Resident Support', 'Local Opener'], blurb: 'Opening night of the new Vinyl weekly.', flyer: '', tickets: 'https://example.com/tickets', guestList: { open: true, terms: 'Reduced entry before 11 PM. 21+.', maxPlus: 2, spotsLeft: 60 } },
      { id: 103, name: 'Tech House Trivia', date: plus(toThu + 7), venue: 'Vinyl', series: 'Vinyl Thursdays', doors: '9:00 PM', age: '21+', lineup: ['Resident DJ'], blurb: '', flyer: '', tickets: '', guestList: { open: true, terms: 'Free with RSVP.', maxPlus: 1, spotsLeft: 80 } },
      { id: 104, name: 'NYE on the North Shore', date: plus(45), venue: 'Plaza + Highball', series: 'Mega-Event', doors: '8:00 PM', age: '18+', lineup: ['Headliner TBA'], blurb: 'Three rooms. One countdown.', flyer: '', tickets: 'https://example.com/nye', guestList: { open: false } },
    ];
    var r;
    if (action === 'publicShows') r = { ok: true, shows: shows };
    else if (action === 'publicShow') { var s = shows.filter(function (x) { return x.id == b.id; })[0]; r = s ? { ok: true, show: s } : { ok: false, error: 'That show could not be found.' }; }
    else if (action === 'rsvp') { var s2 = shows.filter(function (x) { return x.id == b.id; })[0]; r = { ok: true, pass: { code: 'DEMO42', qr: 'GG:DEMO42', firstName: String(b.name).split(' ')[0], plus: b.plus, checkedIn: false, emailed: false, show: { id: s2.id, name: s2.name, date: s2.date, venue: s2.venue, doors: s2.doors, age: s2.age, terms: s2.guestList.terms } } }; }
    else if (action === 'pass') r = { ok: true, pass: { code: 'DEMO42', qr: 'GG:DEMO42', firstName: 'Guest', plus: 1, checkedIn: false, show: { id: 101, name: 'Bass Bingo', date: shows[0].date, venue: 'Vinyl', doors: '9:00 PM', age: '21+', terms: 'Free before 11 PM with RSVP.' } } };
    else r = { ok: false, error: 'Unknown' };
    return new Promise(function (res) { setTimeout(function () { res(r); }, 250); });
  }
})();
